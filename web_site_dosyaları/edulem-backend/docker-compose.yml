version: '3.8'

services:
  # PHP Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: premium-edu-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - premium-edu-network
    depends_on:
      - db
      - redis

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: premium-edu-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - premium-edu-network
    depends_on:
      - app

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: premium-edu-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-premium_edu}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-premium_edu}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - premium-edu-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: premium-edu-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - premium-edu-network
    command: redis-server --appendonly yes

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: premium-edu-queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - premium-edu-network
    depends_on:
      - db
      - redis
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600

  # Scheduler (Cron)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: premium-edu-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - premium-edu-network
    depends_on:
      - db
      - redis
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction &
        sleep 60
      done"

  # Reverb WebSocket Server
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: premium-edu-reverb
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - premium-edu-network
    depends_on:
      - redis
    ports:
      - "8080:8080"
    command: php artisan reverb:start --host=0.0.0.0 --port=8080

  # MinIO Object Storage (S3 Compatible)
  minio:
    image: minio/minio:latest
    container_name: premium-edu-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    networks:
      - premium-edu-network
    command: server /data --console-address ":9001"

networks:
  premium-edu-network:
    driver: bridge

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local